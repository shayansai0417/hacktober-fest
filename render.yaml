services:
  - type: web
    name: papergrade-ai
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/migrate_existing.py && streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --browser.gatherUsageStats false
    healthCheckPath: /_stcore/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: papergrade-ai-db
          property: connectionString
      - key: DEMO_MODE
        value: "false"
      - key: DEMO_LOGIN_ENABLED
        value: "false"
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: GEMMA_MODEL
        value: gemma-4-26b-a4b-it
      - key: GEMMA_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: papergrade-files
      mountPath: /var/data
      sizeGB: 1
databases:
  - name: papergrade-ai-db
    databaseName: papergrade
    user: papergrade
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: DEMO_LOGIN_ENABLED
        value: "false"
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////var/data/papergrade.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: GEMMA_MODEL
        value: gemma-4-26b-a4b-it
      - key: GEMMA_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
